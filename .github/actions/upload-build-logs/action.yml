name: Upload build logs
description: Keep diagnostic logs separately from installable release artifacts.
inputs:
  platform:
    required: true
    description: Build platform name.
runs:
  using: composite
  steps:
    - uses: actions/upload-artifact@v4
      with:
        name: build-logs-${{ inputs.platform }}
        path: build-logs/
        retention-days: 14
        if-no-files-found: ignore
