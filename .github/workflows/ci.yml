name: Checks

on:
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-flutter
      - run: python -m unittest discover -s tool/ci -p 'test_*.py' -v
      - run: python tool/ci/run_logged.py analyze flutter analyze --no-pub lib
      - run: python tool/ci/run_logged.py tests flutter test --no-pub --reporter expanded
      - uses: ./.github/actions/upload-build-logs
        if: always()
        with:
          platform: checks
