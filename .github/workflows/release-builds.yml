name: Release Builds

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-builds
  cancel-in-progress: false

env:
  HOMEBREW_NO_AUTO_UPDATE: '1'
  HOMEBREW_NO_INSTALL_CLEANUP: '1'
  LIBWEBP_VERSION: 1.6.0
  LIBWEBP_WINDOWS_X64_SHA256: 48886f506b21f62e4661f0f4cbfca19800897c385128e8902542d29a950c93f1
  INNO_SETUP_SOURCE_COMMIT: c25dc6479cdc3be28e682a025fcf60765bba3de0
  INNO_CHINESE_SIMPLIFIED_SHA256: 6753be2c5e2740d859900fd902824db2ec568da5c5b52486524c9762d778b0b0

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  version:
    name: Compute version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      app_version: ${{ steps.version.outputs.app_version }}
      build_number: ${{ steps.version.outputs.build_number }}
      artifact_suffix: ${{ steps.version.outputs.artifact_suffix }}
      release_tag: ${{ steps.version.outputs.release_tag }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute semantic version
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version_value="$(awk '/^version:/{print $2; exit}' pubspec.yaml)"
          app_version="${version_value%%+*}"
          build_number="${GITHUB_RUN_NUMBER}"
          release_tag="v${app_version}"
          if [[ ! "$version_value" =~ ^[0-9]+\.[0-9]+\.[0-9]+\+[0-9]+$ ]]; then
            echo "::error::pubspec.yaml must contain a version and numeric build number."
            exit 1
          fi
          if [[ "$GITHUB_REF" != "refs/heads/main" && "$GITHUB_REF" != "refs/tags/$release_tag" ]]; then
            echo "::error::Run releases from main or the matching version tag."
            exit 1
          fi
          publish=true
          if git rev-parse --verify "refs/tags/$release_tag" >/dev/null 2>&1; then
            if [[ "$(git rev-parse "$release_tag^{commit}")" != "$GITHUB_SHA" ]]; then
              if [[ "$GITHUB_REF" == refs/tags/* ]]; then
                echo "::error::Tag does not match the source commit."
                exit 1
              fi
              publish=false
              echo "::notice::Version $app_version already has an immutable tag; build only. Bump version for a new release."
            fi
          fi
          if [[ "$publish" == true ]] && gh release view "$release_tag" --json isDraft --jq '.isDraft' > /tmp/release-draft 2>/dev/null; then
            if [[ "$(cat /tmp/release-draft)" == false ]]; then
              publish=false
              echo "::notice::Release $release_tag is already published; do not replace its assets."
            fi
          fi
          {
            echo "publish=${publish}"
            echo "app_version=${app_version}"
            echo "build_number=${build_number}"
            echo "release_tag=${release_tag}"
            echo "artifact_suffix=v${app_version}+${build_number}"
          } >> "$GITHUB_OUTPUT"
          echo "Building ${app_version}+${build_number}"
          # Backticks here are Markdown, not shell substitutions.
          # shellcheck disable=SC2016
          printf '## Build plan\n\n- Version: `%s+%s`\n- Commit: `%s`\n- Publish: `%s`\n' \
            "$app_version" "$build_number" "$GITHUB_SHA" "$publish" >> "$GITHUB_STEP_SUMMARY"

  android:
    name: Android APK
    runs-on: ubuntu-latest
    needs: [version]
    timeout-minutes: 35
    # 签名凭据统一映射到 job 环境变量（secrets 不可直接用于 if 条件）。
    # 正式发布必须配置完整签名，不能回退到 debug 签名。
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - uses: ./.github/actions/setup-flutter

      - name: Import Android signing keystore
        shell: bash
        run: |
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing signing secret: $name"
              exit 1
            fi
          done
          mkdir -p "$GITHUB_WORKSPACE/android/app"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/android/app/keystore-release.jks"
          test -s "$GITHUB_WORKSPACE/android/app/keystore-release.jks"

      - name: Build APK
        env:
          ANDROID_KEYSTORE_FILE: ${{ format('{0}/android/app/keystore-release.jks', github.workspace) }}
        run: >
          python tool/ci/run_logged.py android flutter build apk --release --no-pub
          --build-name "${{ needs.version.outputs.app_version }}"
          --build-number "${{ needs.version.outputs.build_number }}"

      - name: Package APK
        shell: bash
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/epub-toolkit-android-${{ needs.version.outputs.artifact_suffix }}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: epub-toolkit-android-${{ needs.version.outputs.artifact_suffix }}
          path: dist/epub-toolkit-android-${{ needs.version.outputs.artifact_suffix }}.apk
          if-no-files-found: error
          compression-level: 0
      - uses: ./.github/actions/upload-build-logs
        if: always()
        with:
          platform: android

  macos:
    name: macOS App
    runs-on: macos-latest
    needs: [version]
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: ./.github/actions/setup-flutter

      - name: Install WebP encoder
        run: command -v cwebp >/dev/null || brew install webp

      - name: Build macOS
        run: >
          python tool/ci/run_logged.py macos flutter build macos --release --no-pub
          --build-name "${{ needs.version.outputs.app_version }}"
          --build-number "${{ needs.version.outputs.build_number }}"

      - name: Bundle WebP encoder
        shell: bash
        run: |
          app_path="$(find build/macos/Build/Products/Release -maxdepth 1 -name '*.app' -type d | head -n 1)"
          test -n "$app_path"
          tool/bundle_cwebp_macos.sh "$app_path"
          "$app_path/Contents/Resources/bin/cwebp" -version
          codesign --verify --deep --strict "$app_path"

      - name: Package macOS app
        shell: bash
        run: |
          app_path="$(find build/macos/Build/Products/Release -maxdepth 1 -name '*.app' -type d | head -n 1)"
          test -n "$app_path"
          ditto -c -k --sequesterRsrc --keepParent "$app_path" "epub-toolkit-macos-${{ needs.version.outputs.artifact_suffix }}.zip"

      - name: Upload macOS app
        uses: actions/upload-artifact@v4
        with:
          name: epub-toolkit-macos-${{ needs.version.outputs.artifact_suffix }}
          path: epub-toolkit-macos-${{ needs.version.outputs.artifact_suffix }}.zip
          if-no-files-found: error
          compression-level: 0
      - uses: ./.github/actions/upload-build-logs
        if: always()
        with:
          platform: macos

  windows:
    name: Windows App
    runs-on: windows-latest
    needs: [version]
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: ./.github/actions/setup-flutter

      - name: Build Windows
        run: >
          python tool/ci/run_logged.py windows flutter build windows --release --no-pub
          --build-name "${{ needs.version.outputs.app_version }}"
          --build-number "${{ needs.version.outputs.build_number }}"

      - name: Bundle WebP encoder
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'libwebp-windows-x64.zip'
          $extractDir = Join-Path $env:RUNNER_TEMP 'libwebp-windows-x64'
          $url = "https://storage.googleapis.com/downloads.webmproject.org/releases/webp/libwebp-$env:LIBWEBP_VERSION-windows-x64.zip"
          Invoke-WebRequest -Uri $url -OutFile $archive

          $actualHash = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          if ($actualHash -ne $env:LIBWEBP_WINDOWS_X64_SHA256) {
            throw "libwebp checksum mismatch: expected $env:LIBWEBP_WINDOWS_X64_SHA256, got $actualHash"
          }

          Expand-Archive -Path $archive -DestinationPath $extractDir -Force
          $sourceRoot = Join-Path $extractDir "libwebp-$env:LIBWEBP_VERSION-windows-x64"
          $releaseDir = 'build\windows\x64\runner\Release'
          $binDir = Join-Path $releaseDir 'bin'
          $licenseDir = Join-Path $releaseDir 'licenses\libwebp'
          New-Item -ItemType Directory -Force -Path $binDir | Out-Null
          New-Item -ItemType Directory -Force -Path $licenseDir | Out-Null
          Copy-Item (Join-Path $sourceRoot 'bin\cwebp.exe') (Join-Path $binDir 'cwebp.exe')
          Copy-Item 'third_party\libwebp\COPYING' $licenseDir
          Copy-Item 'third_party\libwebp\PATENTS' $licenseDir

          & (Join-Path $binDir 'cwebp.exe') -version
          if ($LASTEXITCODE -ne 0) {
            throw "Bundled cwebp.exe failed with exit code $LASTEXITCODE"
          }

      - name: Bundle WebView2 Runtime installer
        shell: pwsh
        run: |
          $releaseDir = 'build\windows\x64\runner\Release'
          $installer = Join-Path $releaseDir 'MicrosoftEdgeWebView2Setup.exe'
          Invoke-WebRequest -Uri 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile $installer
          $signature = Get-AuthenticodeSignature $installer
          if ($signature.Status -ne 'Valid') {
            throw "WebView2 installer signature is invalid: $($signature.Status)"
          }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress --yes
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed' }
          }

      - name: Install Inno Setup Chinese language
        shell: pwsh
        run: |
          $isccDir = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6'
          $languageDir = Join-Path $isccDir 'Languages'
          $languageFile = Join-Path $languageDir 'ChineseSimplified.isl'
          $downloadFile = Join-Path $env:RUNNER_TEMP 'ChineseSimplified.isl'
          $url = "https://raw.githubusercontent.com/jrsoftware/issrc/$env:INNO_SETUP_SOURCE_COMMIT/Files/Languages/ChineseSimplified.isl"

          curl.exe --fail --location --retry 5 --retry-all-errors `
            --output $downloadFile $url
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to download Inno Setup Chinese language file"
          }

          $actualHash = (Get-FileHash -Algorithm SHA256 $downloadFile).Hash.ToLowerInvariant()
          if ($actualHash -ne $env:INNO_CHINESE_SIMPLIFIED_SHA256) {
            throw "Inno language checksum mismatch: expected $env:INNO_CHINESE_SIMPLIFIED_SHA256, got $actualHash"
          }

          New-Item -ItemType Directory -Force -Path $languageDir | Out-Null
          Copy-Item -Force $downloadFile $languageFile
          if (-not (Test-Path $languageFile)) {
            throw "Inno Setup Chinese language file was not installed: $languageFile"
          }

      - name: Package Windows installer
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            throw "Inno Setup compiler not found: $iscc"
          }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $env:EPUB_TOOLKIT_VERSION = '${{ needs.version.outputs.app_version }}'
          $env:EPUB_TOOLKIT_ARTIFACT_SUFFIX = '${{ needs.version.outputs.artifact_suffix }}'
          & $iscc "windows\installer.iss"
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup failed with exit code $LASTEXITCODE"
          }
          $installer = Get-ChildItem 'dist\epub-toolkit-windows-*-setup.exe' |
            Select-Object -First 1
          if ($null -eq $installer) {
            throw 'Windows installer was not generated'
          }
          Write-Host "Generated installer: $($installer.FullName)"

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: epub-toolkit-windows-${{ needs.version.outputs.artifact_suffix }}
          path: dist/epub-toolkit-windows-${{ needs.version.outputs.artifact_suffix }}-setup.exe
          if-no-files-found: error
          compression-level: 0
      - uses: ./.github/actions/upload-build-logs
        if: always()
        with:
          platform: windows

  ios:
    name: iOS App
    runs-on: macos-latest
    needs: [version]
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: ./.github/actions/setup-flutter

      - name: Build iOS without code signing
        run: >
          python tool/ci/run_logged.py ios flutter build ios --release --no-codesign --no-pub
          --build-name "${{ needs.version.outputs.app_version }}"
          --build-number "${{ needs.version.outputs.build_number }}"

      - name: Package iOS app
        shell: bash
        run: |
          app_path="$(find build/ios/iphoneos -maxdepth 1 -name '*.app' -type d | head -n 1)"
          test -n "$app_path"
          ditto -c -k --sequesterRsrc --keepParent "$app_path" "epub-toolkit-ios-${{ needs.version.outputs.artifact_suffix }}-unsigned.zip"

      - name: Upload unsigned iOS app
        uses: actions/upload-artifact@v4
        with:
          name: epub-toolkit-ios-${{ needs.version.outputs.artifact_suffix }}-unsigned
          path: epub-toolkit-ios-${{ needs.version.outputs.artifact_suffix }}-unsigned.zip
          if-no-files-found: error
          compression-level: 0
      - uses: ./.github/actions/upload-build-logs
        if: always()
        with:
          platform: ios

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    timeout-minutes: 10
    if: needs.version.outputs.publish == 'true'
    needs:
      - version
      - checks
      - android
      - macos
      - windows
      - ios
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: epub-toolkit-*
          path: release-assets
          merge-multiple: true

      - name: List release assets
        run: find release-assets -type f -maxdepth 1 -print

      - name: Generate release notes and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          APP_VERSION: ${{ needs.version.outputs.app_version }}
          BUILD_NUMBER: ${{ needs.version.outputs.build_number }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" > release-jobs.json
          python tool/ci/release_notes.py

      - name: Create or verify immutable release tag
        env:
          RELEASE_TAG: ${{ needs.version.outputs.release_tag }}
        run: |
          if git ls-remote --exit-code origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            git fetch --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
            test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$GITHUB_SHA"
          else
            git tag "$RELEASE_TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$RELEASE_TAG"
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          name: EPUB 工具箱 ${{ needs.version.outputs.app_version }}
          body_path: release-notes.md
          files: release-assets/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          make_latest: true
